<div class="modal-overlay">
	<div class="modal-container">
		<div class="modal-header">
			<span class="modal-icon">🔲</span>
			<span class="modal-title">Add Truck Details</span>
			<button class="modal-close">&times;</button>
		</div>
		<form class="modal-form">
			<input type="text" placeholder="TRUCK CODE" class="modal-input" />
			<textarea placeholder="DESCRIPTION" class="modal-input"></textarea>
			<input type="text" placeholder="LISCENCE PLATE" class="modal-input" />
			<input type="text" placeholder="MAX CUBIC" class="modal-input" />
			<input type="text" placeholder="MAX UNITS" class="modal-input" />
			<input type="text" placeholder="MAX WEIGHT" class="modal-input" />
			<select class="modal-input">
				<option value="" disabled selected>STATUS</option>
				<option value="active">Active</option>
				<option value="inactive">Inactive</option>
			</select>
		</form>
		<div class="modal-footer">
			<button class="modal-back">&#8592;</button>
			<button class="modal-add">ADD</button>
		</div>
	</div>
</div>
